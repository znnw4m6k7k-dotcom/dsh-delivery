name: 发布安装包

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包
        run: |
          mkdir -p dist
          (cd claude-skill && zip -qr ../dist/delivery-contract-claude.zip delivery-contract)
          (cd codex-skill && zip -qr ../dist/delivery-contract-codex.zip delivery-contract)
          # DSH 完整安装包：解压后双击 Install-Mac.command / Install-Windows.bat
          mkdir -p "dist/dsh-delivery"
          cp -R kit Install-Mac.command Install-Windows.bat README.md LICENSE NOTICE.md "dist/dsh-delivery/"
          mkdir -p dist/dsh-delivery/docs && cp "docs/安装问题排查.md" dist/dsh-delivery/docs/
          rm -rf dist/dsh-delivery/kit/tests
          (cd dist && zip -qr dsh-delivery-kit.zip dsh-delivery && rm -rf dsh-delivery)
          ls -la dist
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="nightly"; gh release delete nightly -y --cleanup-tag || true ;; esac
          gh release create "$TAG" dist/*.zip --title "$TAG" --notes-file .github/release-notes.md || gh release upload "$TAG" dist/*.zip --clobber
